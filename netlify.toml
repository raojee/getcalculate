[build]
  command = "npm run build"
  publish = "dist/client"

# ── Cache Headers ────────────────────────────────────────
# HTML / SSR pages: always revalidate with origin (prevents Cloudflare stale cache)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed static assets (JS/CSS bundles): cache forever at edge + browser
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Redirects ────────────────────────────────────────────
# Catch the leaked /solvers/$slug crawl-error URL
[[redirects]]
  from = "/solvers/%24slug"
  to = "/"
  status = 301
  force = true

# SPA fallback — serve index.html for all unmatched routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
